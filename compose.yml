services:
  database:
    image: 'postgres:17'
    env_file:
      - .env # The name of your environment file (the one at the repository root)
    ports:
      - 15432:5432
    networks:
      - postgres-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PWD}/db-data/:/var/lib/postgresql/data/

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 15433:80
    env_file:
      - .env
    depends_on:
      - database
    networks:
      - postgres-network
    volumes:
      - ${PWD}/pgadmin-data/:/var/lib/pgadmin/

  local-s3:
    image: ghcr.io/shyim/local-s3:latest
    ports:
      - 9000:9000
    environment:
      S3_ACCOUNT_APP: ${S3_ACCOUNT_APP:-local-access:local-secret}
    volumes:
      - local-s3-data:/data
    networks:
      - postgres-network

volumes:
  local-s3-data:

networks:
  postgres-network:
    driver: bridge
